services:
  - type: web
    name: price-tracker-backend
    env: node
    buildCommand: npm ci && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: STOREFRONT_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPER_TIMEOUT_MS
        value: 15000
      - key: SCRAPER_MAX_RETRIES
        value: 3
      - key: CRON_SECRET
        generateValue: true
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
